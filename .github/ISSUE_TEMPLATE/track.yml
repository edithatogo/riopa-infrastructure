name: Conductor track task
about: Propose or implement work linked to a Conductor track
title: "[Track] "
labels: ["type:track"]
body:
  - type: input
    id: track
    attributes:
      label: Track ID
      placeholder: provenance_profile_v1_20260718
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: State the observable result, not merely the activity.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: Tests, files, release artifacts, or external evidence required.
    validations:
      required: true
  - type: checkboxes
    id: gates
    attributes:
      label: Required gates
      options:
        - label: Rights/licensing reviewed
        - label: Privacy/governance triggers reviewed
        - label: Schema and migration impact reviewed
        - label: Reproducibility evidence specified
