name: Publish and rebuild licensed Tasman archive

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful council archive run containing standalone Tasman rights
        required: true
        default: "33301038921"
        type: string
  workflow_run:
    workflows: [Preserve bounded council archives]
    types: [completed]

permissions:
  contents: read
  actions: read

# Independent invocations must not interrupt a commit or its verification.
concurrency:
  group: tasman-publication-${{ github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  publish:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: tasman-publication-writer
      cancel-in-progress: false
    env:
      SOURCE_RUN: ${{ inputs.source_run || github.event.workflow_run.id }}
      WORK: .riopa-local/tasman-publication
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
    steps:
      - name: Check out approved implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          version: "0.13.0"
      - name: Install locked spatial and preservation environment
        run: uv sync --extra spatial --extra preservation --frozen
      - name: Publish licensed packet and verify anonymous clean rebuilds
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python scripts/publish_tasman_public_packet.py --source-run "$SOURCE_RUN" --work "$WORK"
      - name: Preserve derived outputs and verify anonymous semantic readback
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python scripts/publish_tasman_derivatives.py --work "$WORK"
      - name: Bind receipts to verified source and publication run attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/record_tasman_run_provenance.py --source-run "$SOURCE_RUN" --work "$WORK"
      - name: Compare features against the immutable accepted baseline
        run: uv run python scripts/record_tasman_snapshot_comparison.py --work "$WORK"
      - name: Preserve bounded cycle metadata without qualifying release cycles
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run python scripts/preserve_tasman_cycle_ledger.py --work "$WORK"
      - name: Retain metadata verification evidence only
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tasman-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: .riopa-local/tasman-publication/public/
          if-no-files-found: warn
          retention-days: 90
