name: Continuous integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  quality:
    name: Quality, contracts, and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
          version: "0.11.16"
      - name: Install locked environment
        run: uv sync --extra dev --extra spatial --frozen
      - name: Run engineering quality harness
        run: scripts/ci_quality.sh
      - name: Verify workflow lint and tracked-secret gates
        run: |
          uv run python scripts/check_workflow_lint.py --root .
          uv run python scripts/check_tracked_secrets.py --root .
      - name: Upload package and SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-and-sbom
          path: dist/package/
          if-no-files-found: error
          retention-days: 30

  tests:
    name: Tests on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.11.16"
      - name: Install independent Node conformance runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install locked environment
        run: uv sync --extra dev --extra spatial --frozen
      - name: Run branch-aware tests
        run: >-
          uv run pytest
          --cov=riopa_provenance
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml:coverage-${{ matrix.python-version }}.xml
          --cov-fail-under=90
      - name: Verify deterministic research objects
        if: matrix.python-version == '3.14'
        run: scripts/ci_reproducibility.sh
      - name: Verify bounded cross-language conformance parity
        if: matrix.python-version == '3.14'
        run: uv run python scripts/verify_conformance_parity.py --output conformance-parity.json
      - name: Upload coverage evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.python-version }}
          path: |
            coverage-${{ matrix.python-version }}.xml
            conformance-parity.json
          if-no-files-found: error
          retention-days: 30

  dependency-review:
    name: Dependency change review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          show-patched-versions: true
