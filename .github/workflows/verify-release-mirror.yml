name: Verify public release mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "41 15 * * 1"

permissions:
  contents: read

concurrency:
  group: verify-release-mirror-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          version: "0.13.0"
      - name: Verify all mirrored release bytes
        run: uv run python scripts/verify_hf_release_mirror.py --output dist/release-mirror-verification.json
      - name: Upload verification report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-mirror-verification-${{ github.run_id }}
          path: dist/release-mirror-verification.json
          if-no-files-found: error
          retention-days: 90
