name: Bounded mutation qualification

on:
  schedule:
    - cron: "17 4 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  mutation:
    name: Validation and publication mutation lane
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.14"
          version: "0.13.0"
      - name: Install locked environment
        run: uv sync --extra dev --extra spatial --frozen
      - name: Run bounded mutation suite
        run: uv run mutmut run --max-children 2
      - name: Validate and record mutation score
        run: |
          uv run mutmut results --all=true > mutation-results.txt
          uv run python scripts/check_mutation_score.py \
            --results mutation-results.txt \
            --minimum 0.65 \
            --output mutation-score.json
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bounded-mutation-evidence
          path: |
            mutation-results.txt
            mutation-score.json
          if-no-files-found: warn
          retention-days: 90
