name: Hosted evidence campaign

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Bounded evidence lane
        required: true
        default: recovery-rollback
        type: choice
        options:
          - recovery-rollback
          - agent-clean-room
          - scale-smoke
          - performance-rehearsal
          - agent-user-workflows
          - operational-observation
          - rc-soak-observation
          - retrospective-replay
      campaign_id:
        description: Stable evidence-campaign identifier
        required: true
        default: operational-beta-20260830-26bc0b4
        type: string
      candidate_revision:
        description: Exact candidate; pinned by default for beta and required for RC soak
        required: false
        default: "26bc0b49bcd84f409bf24b527e1049fd396c94a6"
        type: string
      qualification_epoch:
        description: Change only when a material beta candidate or instrumentation change resets the clock
        required: true
        default: beta-epoch-20260830-26bc0b4
        type: string
      qualification:
        description: Whether this run is a formally activated qualifying beta/RC observation
        required: true
        default: supplemental
        type: choice
        options:
          - supplemental
          - qualifying
      activation_authority:
        description: Named authority recorded only for an explicitly qualifying campaign
        required: false
        type: string
      activated_at:
        description: UTC activation timestamp for an explicitly qualifying campaign
        required: false
        type: string
  schedule:
    - cron: "17 14 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  # Keep unrelated campaigns and exact RC candidates isolated.  A manual
  # replay must not cancel the protected-main beta run, and a new RC
  # candidate must not cancel observations for the prior candidate.
  group: evidence-campaign-${{ github.event_name == 'schedule' && 'operational-beta-20260830-26bc0b4' || github.event.inputs.campaign_id || format('operational-beta-{0}', github.sha) }}-${{ github.event.inputs.lane || 'operational-observation' }}-${{ github.event_name == 'schedule' && '26bc0b49bcd84f409bf24b527e1049fd396c94a6' || github.event.inputs.candidate_revision || github.sha }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  observe:
    name: Record hosted evidence receipt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EVIDENCE_LANE: ${{ github.event.inputs.lane || 'operational-observation' }}
      EVIDENCE_CAMPAIGN_ID: ${{ github.event_name == 'schedule' && 'operational-beta-20260830-26bc0b4' || github.event.inputs.campaign_id || format('operational-beta-{0}', github.sha) }}
      EVIDENCE_CANDIDATE_REVISION: ${{ github.event_name == 'schedule' && '26bc0b49bcd84f409bf24b527e1049fd396c94a6' || github.event.inputs.candidate_revision || github.sha }}
      EVIDENCE_QUALIFICATION_EPOCH: ${{ github.event_name == 'schedule' && 'beta-epoch-20260830-26bc0b4' || github.event.inputs.qualification_epoch || format('beta-epoch-{0}', github.sha) }}
      EVIDENCE_QUALIFYING: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.qualification == 'qualifying' && 'true' || 'false' }}
      EVIDENCE_ACTIVATION_AUTHORITY: ${{ github.event_name == 'schedule' && 'edithatogo' || github.event.inputs.activation_authority || '' }}
      EVIDENCE_ACTIVATED_AT: ${{ github.event_name == 'schedule' && '2026-08-30T02:41:05Z' || github.event.inputs.activated_at || '' }}
    steps:
      - name: Validate exact revision input
        run: |
          if [[ ! "$EVIDENCE_CANDIDATE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "EVIDENCE_CANDIDATE_REVISION must be a full 40-character Git commit SHA" >&2
            exit 1
          fi
      - name: Check out workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Save current campaign tooling
        run: |
          mkdir -p "$RUNNER_TEMP/riopa-campaign-tooling"
          cp scripts/record_hosted_evidence.py "$RUNNER_TEMP/riopa-campaign-tooling/"
          cp scripts/build_campaign_ledger.py "$RUNNER_TEMP/riopa-campaign-tooling/"
          cp schemas/hosted-evidence.schema.json "$RUNNER_TEMP/riopa-campaign-tooling/"
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # RC observations are content-addressed to the supplied candidate;
          # later documentation commits on main must not change the candidate.
          ref: ${{ env.EVIDENCE_CANDIDATE_REVISION || github.sha }}
      - name: Restore current campaign tooling
        run: |
          cp "$RUNNER_TEMP/riopa-campaign-tooling/record_hosted_evidence.py" scripts/
          cp "$RUNNER_TEMP/riopa-campaign-tooling/build_campaign_ledger.py" scripts/
          cp "$RUNNER_TEMP/riopa-campaign-tooling/hosted-evidence.schema.json" schemas/
      - name: Verify exact RC candidate checkout
        if: env.EVIDENCE_LANE == 'rc-soak-observation'
        run: test "$(git rev-parse HEAD)" = "$EVIDENCE_CANDIDATE_REVISION"
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
          version: "0.11.16"
      - name: Install locked environment
        run: uv sync --extra dev --extra spatial --frozen
      - name: Execute bounded lane
        id: execute
        continue-on-error: true
        run: >-
          uv run python scripts/record_hosted_evidence.py "$EVIDENCE_LANE"
          --output-dir "dist/hosted-evidence/${GITHUB_RUN_ID}"
      - name: Validate receipt schema
        if: always()
        run: >-
          uv run jsonschema
          --instance "dist/hosted-evidence/${GITHUB_RUN_ID}/${EVIDENCE_LANE}.receipt.json"
          schemas/hosted-evidence.schema.json
      - name: Validate bounded performance report
        if: ${{ always() && steps.execute.outcome == 'success' && env.EVIDENCE_LANE == 'performance-rehearsal' }}
        run: uv run python scripts/validate_performance_report.py "dist/hosted-evidence/${GITHUB_RUN_ID}/benchmark.json"
      - name: Restore the latest cumulative campaign artifact
        if: ${{ always() && env.EVIDENCE_QUALIFYING == 'true' && (env.EVIDENCE_LANE == 'operational-observation' || env.EVIDENCE_LANE == 'rc-soak-observation') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/campaign-history dist/prior-campaign
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=evidence-campaign-${EVIDENCE_CAMPAIGN_ID}-${EVIDENCE_LANE}&per_page=100" --jq '.artifacts | sort_by(.created_at) | last | .id // empty')"
          if [[ -n "$artifact_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > dist/prior-campaign.zip
            unzip -q dist/prior-campaign.zip -d dist/prior-campaign
            find dist/prior-campaign -name '*.receipt.json' -exec cp {} dist/campaign-history/ \;
          fi
          cp "dist/hosted-evidence/${GITHUB_RUN_ID}/${EVIDENCE_LANE}.receipt.json" \
            "dist/campaign-history/${GITHUB_RUN_ID}-${EVIDENCE_LANE}.receipt.json"
      - name: Build cumulative fail-closed campaign ledger
        if: ${{ always() && env.EVIDENCE_QUALIFYING == 'true' && (env.EVIDENCE_LANE == 'operational-observation' || env.EVIDENCE_LANE == 'rc-soak-observation') }}
        run: >-
          uv run python scripts/build_campaign_ledger.py
          dist/campaign-history/*.receipt.json
          --output dist/campaign-ledger.json
      - name: Build replication manifest
        if: always()
        run: >-
          uv run python scripts/build_redundancy_manifest.py
          dist/hosted-evidence/${GITHUB_RUN_ID}
          --bundle-id "${EVIDENCE_CAMPAIGN_ID}-${EVIDENCE_LANE}-${GITHUB_RUN_ID}"
          --output "dist/hosted-evidence/${GITHUB_RUN_ID}/redundancy-manifest.json"
      - name: Upload cumulative content-bound evidence
        if: ${{ always() && env.EVIDENCE_QUALIFYING == 'true' && (env.EVIDENCE_LANE == 'operational-observation' || env.EVIDENCE_LANE == 'rc-soak-observation') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-campaign-${{ env.EVIDENCE_CAMPAIGN_ID }}-${{ env.EVIDENCE_LANE }}
          path: |
            dist/campaign-history/
            dist/campaign-ledger.json
            dist/hosted-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Upload retrospective supplemental evidence
        if: ${{ always() && (env.EVIDENCE_QUALIFYING != 'true' || (env.EVIDENCE_LANE != 'operational-observation' && env.EVIDENCE_LANE != 'rc-soak-observation')) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-campaign-${{ env.EVIDENCE_CAMPAIGN_ID }}-${{ env.EVIDENCE_LANE }}-${{ github.run_id }}
          path: dist/hosted-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Fail when the bounded lane failed
        if: always() && steps.execute.outcome != 'success'
        run: exit 1

  performance-second-environment:
    name: Repeat bounded performance rehearsal on macOS
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'performance-rehearsal'
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      EVIDENCE_LANE: performance-rehearsal
      EVIDENCE_CAMPAIGN_ID: ${{ inputs.campaign_id }}
      EVIDENCE_CANDIDATE_REVISION: ${{ inputs.candidate_revision || github.sha }}
      EVIDENCE_QUALIFICATION_EPOCH: ${{ inputs.qualification_epoch }}
    steps:
      - name: Validate exact revision input
        run: |
          if [[ ! "$EVIDENCE_CANDIDATE_REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "EVIDENCE_CANDIDATE_REVISION must be a full 40-character Git commit SHA" >&2
            exit 1
          fi
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EVIDENCE_CANDIDATE_REVISION }}
      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: "3.14"
          version: "0.11.16"
      - name: Install locked environment
        run: uv sync --extra dev --extra spatial --frozen
      - name: Execute bounded performance rehearsal
        run: >-
          uv run python scripts/record_hosted_evidence.py performance-rehearsal
          --output-dir "dist/hosted-evidence/${GITHUB_RUN_ID}"
      - name: Validate receipt schema
        run: >-
          uv run jsonschema
          --instance "dist/hosted-evidence/${GITHUB_RUN_ID}/performance-rehearsal.receipt.json"
          schemas/hosted-evidence.schema.json
      - name: Validate bounded performance report
        run: uv run python scripts/validate_performance_report.py "dist/hosted-evidence/${GITHUB_RUN_ID}/benchmark.json"
      - name: Upload second-environment evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-second-environment-${{ github.run_id }}
          path: dist/hosted-evidence/
          if-no-files-found: error
          retention-days: 90
