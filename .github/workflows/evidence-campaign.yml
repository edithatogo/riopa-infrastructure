name: Hosted evidence campaign

on:
  workflow_dispatch:
    inputs:
      lane:
        description: Bounded evidence lane
        required: true
        default: recovery-rollback
        type: choice
        options:
          - recovery-rollback
          - agent-clean-room
          - scale-smoke
          - operational-observation
          - rc-soak-observation
          - retrospective-replay
      campaign_id:
        description: Stable evidence-campaign identifier
        required: true
        default: operational-beta-20260802
        type: string
      candidate_revision:
        description: Required exact 40-character revision for an RC-soak observation
        required: false
        default: ""
        type: string
      qualification_epoch:
        description: Change only when a material beta candidate or instrumentation change resets the clock
        required: true
        default: beta-epoch-20260802
        type: string
  schedule:
    - cron: "17 14 * * *"

permissions:
  actions: read
  contents: read

concurrency:
  group: evidence-campaign-${{ github.event.inputs.lane || 'operational-observation' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  observe:
    name: Record hosted evidence receipt
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EVIDENCE_LANE: ${{ github.event.inputs.lane || 'operational-observation' }}
      EVIDENCE_CAMPAIGN_ID: ${{ github.event.inputs.campaign_id || 'operational-beta-20260802' }}
      EVIDENCE_CANDIDATE_REVISION: ${{ github.event.inputs.candidate_revision || '' }}
      EVIDENCE_QUALIFICATION_EPOCH: ${{ github.event.inputs.qualification_epoch || 'beta-epoch-20260802' }}
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.14"
          version: "0.11.16"
      - name: Install locked environment
        run: uv sync --extra dev --extra spatial --frozen
      - name: Execute bounded lane
        id: execute
        continue-on-error: true
        run: >-
          uv run python scripts/record_hosted_evidence.py "$EVIDENCE_LANE"
          --output-dir "dist/hosted-evidence/${GITHUB_RUN_ID}"
      - name: Validate receipt schema
        if: always()
        run: >-
          uv run jsonschema
          --instance "dist/hosted-evidence/${GITHUB_RUN_ID}/${EVIDENCE_LANE}.receipt.json"
          schemas/hosted-evidence.schema.json
      - name: Restore the latest cumulative campaign artifact
        if: always() && env.EVIDENCE_LANE != 'retrospective-replay'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/campaign-history dist/prior-campaign
          artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=evidence-campaign-${EVIDENCE_CAMPAIGN_ID}-${EVIDENCE_LANE}&per_page=100" --jq '.artifacts | sort_by(.created_at) | last | .id // empty')"
          if [[ -n "$artifact_id" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > dist/prior-campaign.zip
            unzip -q dist/prior-campaign.zip -d dist/prior-campaign
            find dist/prior-campaign -name '*.receipt.json' -exec cp {} dist/campaign-history/ \;
          fi
          cp "dist/hosted-evidence/${GITHUB_RUN_ID}/${EVIDENCE_LANE}.receipt.json" \
            "dist/campaign-history/${GITHUB_RUN_ID}-${EVIDENCE_LANE}.receipt.json"
      - name: Build cumulative fail-closed campaign ledger
        if: always() && env.EVIDENCE_LANE != 'retrospective-replay'
        run: >-
          uv run python scripts/build_campaign_ledger.py
          dist/campaign-history/*.receipt.json
          --output dist/campaign-ledger.json
      - name: Build replication manifest
        if: always()
        run: >-
          uv run python scripts/build_redundancy_manifest.py
          dist/hosted-evidence/${GITHUB_RUN_ID}
          --bundle-id "${EVIDENCE_CAMPAIGN_ID}-${EVIDENCE_LANE}-${GITHUB_RUN_ID}"
          --output "dist/hosted-evidence/${GITHUB_RUN_ID}/redundancy-manifest.json"
      - name: Upload cumulative content-bound evidence
        if: always() && env.EVIDENCE_LANE != 'retrospective-replay'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-campaign-${{ env.EVIDENCE_CAMPAIGN_ID }}-${{ env.EVIDENCE_LANE }}
          path: |
            dist/campaign-history/
            dist/campaign-ledger.json
            dist/hosted-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Upload retrospective supplemental evidence
        if: always() && env.EVIDENCE_LANE == 'retrospective-replay'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-campaign-${{ env.EVIDENCE_CAMPAIGN_ID }}-retrospective-${{ github.run_id }}
          path: dist/hosted-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Fail when the bounded lane failed
        if: always() && steps.execute.outcome != 'success'
        run: exit 1
