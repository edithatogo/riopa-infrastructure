name: Build, attest, and publish release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build:
    name: Build release candidate without write credentials
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: "0.11.16"
      - name: Install independent Node conformance runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Install locked environment
        run: uv sync --extra dev --extra spatial --frozen
      - name: Verify release tag and package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/check_release_version.py --tag "$RELEASE_TAG"
      - name: Run complete quality and test harness
        run: |
          scripts/ci_quality.sh
          uv run pytest --cov=riopa_provenance --cov-branch --cov-report=term-missing --cov-fail-under=90
          scripts/ci_reproducibility.sh
      - name: Build release assets
        run: |
          rm -rf dist/release dist/research-object
          mkdir -p dist/release
          uv build --out-dir dist/release
          uv run twine check dist/release/*
          scripts/build_sbom.sh dist/release/riopa-provenance.cdx.json
          uv run riopa research-object \
            --manifest examples/minimal/snapshot-manifest.json \
            --output-dir dist/research-object
          uv run riopa research-object-verify --root dist/research-object
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          tar \
            --sort=name \
            --mtime="@$SOURCE_DATE_EPOCH" \
            --owner=0 \
            --group=0 \
            --numeric-owner \
            -cf dist/release/riopa-example-research-object.tar \
            -C dist/research-object .
          gzip -n -f dist/release/riopa-example-research-object.tar
          (
            cd dist/release
            sha256sum -- * > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-candidate
          path: dist/release/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Attest and publish protected tag
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: dist/release
          digest-mismatch: error
      - name: Reverify release checksums
        run: |
          cd dist/release
          sha256sum --check SHA256SUMS
      - name: Attest release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/release/*.whl
            dist/release/*.tar.gz
            dist/release/*.cdx.json
            dist/release/SHA256SUMS
      - name: Independently verify registered attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in \
            dist/release/*.whl \
            dist/release/*.tar.gz \
            dist/release/*.cdx.json \
            dist/release/SHA256SUMS
          do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
          done
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG"
          dist/release/*
          --verify-tag
          --generate-notes
          --title "$RELEASE_TAG"
