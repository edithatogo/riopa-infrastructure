name: Dependency and supply-chain audit

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - .github/workflows/security.yml
  schedule:
    - cron: "43 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  dependency-audit:
    name: Audit locked runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.14"
          version: "0.13.0"
      - name: Install locked audit environment
        run: uv sync --extra dev --extra spatial --frozen
      - name: Export the locked runtime graph
        run: >-
          uv export
          --frozen
          --no-dev
          --extra spatial
          --no-emit-project
          --output-file runtime-requirements.txt
      - name: Audit known vulnerabilities
        run: >-
          uv run pip-audit
          --requirement runtime-requirements.txt
          --require-hashes
          --strict
          --format json
          --output pip-audit.json
      - name: Build reproducible CycloneDX SBOM
        run: scripts/build_sbom.sh riopa-provenance.cdx.json
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit
          path: |
            runtime-requirements.txt
            pip-audit.json
            riopa-provenance.cdx.json
          if-no-files-found: warn
          retention-days: 90
