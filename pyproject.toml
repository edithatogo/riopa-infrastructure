[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "riopa-provenance"
version = "0.2.0"
description = "Reference contracts and tooling for RIOPA provenance-first research infrastructure"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Dylan Mordaunt" }]
keywords = ["provenance", "reproducibility", "geospatial", "research objects"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "jsonschema[format]>=4.24,<5",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[project.urls]
Homepage = "https://github.com/edithatogo/riopa-infrastructure"
Repository = "https://github.com/edithatogo/riopa-infrastructure"
Issues = "https://github.com/edithatogo/riopa-infrastructure/issues"

[project.scripts]
riopa = "riopa_provenance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/riopa_provenance"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
