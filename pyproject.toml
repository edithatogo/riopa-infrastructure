[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "riopa-provenance"
version = "0.3.0"
description = "Reference contracts and tooling for RIOPA provenance-first research infrastructure"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
authors = [{ name = "Dylan Mordaunt" }]
keywords = ["provenance", "reproducibility", "geospatial", "research objects"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "jsonschema[format]>=4.24,<5",
  "PyYAML>=6.0.2,<7",
  "rfc8785>=0.1.4,<1",
]

[project.optional-dependencies]
archive = [
  "httpx>=0.28,<1",
]
spatial = [
  "httpx>=0.28,<1",
  "duckdb>=1.3,<2",
  "pyarrow>=18,<26",
  "pyproj>=3.6,<4",
  "shapely>=2.0,<3",
]
dev = [
  "bandit>=1.8,<2",
  "build>=1.2,<2",
  "cyclonedx-bom>=6,<8",
  "hypothesis>=6.130,<7",
  "mypy>=1.15,<3",
  "pip-audit>=2.9,<3",
  "pre-commit>=4,<5",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "twine>=7,<8",
  "types-PyYAML>=6.0.12,<7",
]

[project.urls]
Homepage = "https://github.com/edithatogo/riopa-infrastructure"
Repository = "https://github.com/edithatogo/riopa-infrastructure"
Issues = "https://github.com/edithatogo/riopa-infrastructure/issues"

[project.scripts]
riopa = "riopa_provenance.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/riopa_provenance"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["dist", "build"]

[[tool.mypy.overrides]]
module = ["riopa_provenance.capture"]
disable_error_code = ["misc"]

[tool.bandit]
exclude_dirs = ["tests", "dist", "build"]
skips = ["B101"]

[tool.mutmut]
source_paths = ["src/riopa_provenance/validation.py", "src/riopa_provenance/publication.py"]
also_copy = ["src/riopa_provenance", "scripts", "examples", "schemas"]
pytest_add_cli_args = ["-q"]
pytest_add_cli_args_test_selection = ["tests/test_validation_integrity.py", "tests/test_publication.py"]
mutate_only_covered_lines = true
max_stack_depth = 8

[dependency-groups]
dev = [
    "mutmut>=3.3,<4",
    "pyshacl>=0.40.1",
]
