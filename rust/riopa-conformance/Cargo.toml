[package]
name = "riopa-conformance"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Bounded typed Rust model for the RIOPA conformance contract"

[dependencies]
jsonschema = { version = "0.52.0", default-features = false }
serde_json = "1"
serde_json_canonicalizer = "0.3.2"
sha2 = "0.10"

[lib]
path = "src/lib.rs"
