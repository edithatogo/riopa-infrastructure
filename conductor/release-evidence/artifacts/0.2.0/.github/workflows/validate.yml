name: Validate architecture bundle

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
          version: "0.12.13"
      - name: Install locked environment
        run: uv sync --extra dev --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Validate architecture and example bundle
        run: |
          uv run riopa validate --root .
          uv run riopa roadmap validate --root .
      - name: Reject generated issue drift
        run: |
          cp project/issues.yaml /tmp/issues.json
          uv run riopa roadmap generate-issues --root .
          diff -u /tmp/issues.json project/issues.yaml
      - name: Generate roadmap status
        run: uv run riopa roadmap status --root . --output ROADMAP_STATUS.md
      - name: Run tests with branch coverage
        run: >-
          uv run pytest
          --cov=riopa_provenance
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90
      - name: Rebuild methods deterministically
        run: |
          uv run riopa methods \
            --manifest examples/minimal/snapshot-manifest.json \
            --output /tmp/METHODS.md
          diff -u examples/minimal/METHODS.md /tmp/METHODS.md
      - name: Build and verify example research object
        run: |
          uv run riopa research-object \
            --manifest examples/minimal/snapshot-manifest.json \
            --output-dir dist/example-research-object
          cd dist/example-research-object
          sha256sum --check checksums.sha256
