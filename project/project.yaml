{
  "title": "RIOPA Stable v1.0 Roadmap",
  "description": "Evidence-gated 28-track programme from specified prototype to a stable, hardened, independently reproducible and supported RIOPA v1.0.",
  "visibility": "PUBLIC",
  "repository": "edithatogo/riopa-infrastructure",
  "fields": [
    {
      "name": "Phase",
      "type": "SINGLE_SELECT",
      "options": [
        "Foundation",
        "Core",
        "NZ Spatial",
        "Analytics",
        "Applications",
        "Publication",
        "Release"
      ]
    },
    {
      "name": "Track ID",
      "type": "TEXT"
    },
    {
      "name": "Evidence status",
      "type": "SINGLE_SELECT",
      "options": [
        "None",
        "Partial",
        "Validated",
        "Released",
        "Expired",
        "Waived"
      ]
    },
    {
      "name": "Current maturity",
      "type": "SINGLE_SELECT",
      "options": [
        "M0",
        "M1",
        "M2",
        "M3",
        "M4",
        "M5",
        "M6"
      ]
    },
    {
      "name": "Maturity target",
      "type": "SINGLE_SELECT",
      "options": [
        "M1",
        "M2",
        "M3",
        "M4",
        "M5",
        "M6"
      ]
    },
    {
      "name": "Target release",
      "type": "TEXT"
    },
    {
      "name": "Risk",
      "type": "SINGLE_SELECT",
      "options": [
        "Low",
        "Medium",
        "High",
        "Critical"
      ]
    },
    {
      "name": "Priority",
      "type": "SINGLE_SELECT",
      "options": [
        "P0",
        "P1",
        "P2",
        "P3"
      ]
    },
    {
      "name": "Stability class",
      "type": "SINGLE_SELECT",
      "options": [
        "Normative",
        "Platform",
        "Operational",
        "Reference",
        "Governance"
      ]
    },
    {
      "name": "V1 critical",
      "type": "SINGLE_SELECT",
      "options": [
        "Yes",
        "No"
      ]
    },
    {
      "name": "Owner repository",
      "type": "TEXT"
    },
    {
      "name": "Owner role",
      "type": "TEXT"
    },
    {
      "name": "Blocking defects",
      "type": "NUMBER"
    }
  ],
  "recommended_views": [
    {
      "name": "V1 critical path",
      "filter": "V1 critical:Yes",
      "group_by": "Target release"
    },
    {
      "name": "By maturity",
      "group_by": "Current maturity"
    },
    {
      "name": "By phase",
      "group_by": "Phase"
    },
    {
      "name": "Release blockers",
      "filter": "V1 critical:Yes Evidence status:None,Partial,Expired"
    },
    {
      "name": "High and critical risk",
      "filter": "Risk:High,Critical"
    },
    {
      "name": "Normative freeze queue",
      "filter": "Stability class:Normative Current maturity:M0,M1,M2,M3,M4"
    },
    {
      "name": "Operational readiness",
      "filter": "Stability class:Operational Evidence status:None,Partial,Expired"
    },
    {
      "name": "RC qualification",
      "filter": "Target release:0.9.0"
    },
    {
      "name": "GA qualification",
      "filter": "Target release:1.0.0"
    },
    {
      "name": "Independent validation",
      "filter": "Phase:Publication,Release"
    },
    {
      "name": "Cross-repository adoption",
      "filter": "label:cross-repo"
    },
    {
      "name": "Blocked work",
      "filter": "is:open blocked-by:*"
    }
  ],
  "umbrella": {
    "owner": "edithatogo",
    "project_number": 4,
    "title": "Rare Insights on Open Policy from Aotearoa",
    "mirror_field": "Mirror source",
    "required_option": "riopa-infrastructure"
  }
}
