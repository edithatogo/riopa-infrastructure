      "body": "Implementation phase for Conductor track `operations_preservation_sre_20260719`.\n\n## Tasks\n\n- [ ] 4.1 Operate the release pipeline for the required beta evidence period.\n- [ ] 4.2 Publish SLO, incident, capacity and preservation reports.\n- [ ] 4.3 Approve stable operational risk and support obligations.\n- [ ] 4.4 Start the protected-main cumulative daily beta campaign with a fail-closed hash-chained ledger. (`docs/operational-beta-observation-20260802.json`)\n- [ ] 4.6 Isolate scheduled, replay and exact-RC campaign runs by campaign, lane and candidate revision so unrelated runs cannot cancel one another. (`.github/workflows/evidence-campaign.yml`, `tests/test_campaign_v2.py`)\n- [ ] 4.7 Deduplicate identical receipt bytes restored under multiple artifact paths before calculating elapsed or cycle counts. (`scripts/build_campaign_ledger.py`, `tests/test_campaign_ledger.py`)\n- [ ] 4.8 Validate the checked-in campaign status snapshot for unique runs, exact RC binding and latest receipt revision before release readiness checks. (`scripts/validate_campaign_status.py`, `tests/test_campaign_status.py`, `scripts/ci_quality.sh`)\n- [ ] 4.5 Bind RC-soak execution to the supplied exact candidate revision so later documentation commits do not silently change the candidate. (`.github/workflows/evidence-campaign.yml`, `scripts/record_hosted_evidence.py`, `tests/test_campaign_v2.py`; the 30-day duration remains pending.)\n- [ ] 4.9 Bind scheduled protected-main observations to the current `github.sha` and derive revision-specific campaign/qualification identifiers so merges automatically reset elapsed segments (`docs/beta-campaign-schedule-hardening-20260829.json`, `.github/workflows/evidence-campaign.yml`, `tests/test_campaign_v2.py`).\n- [ ] 4.10 Verify the immutable public Hugging Face release mirror from an unauthenticated scheduled workflow, failing closed on receipt drift, HTTP errors or byte mismatches (`scripts/verify_hf_release_mirror.py`, `.github/workflows/verify-release-mirror.yml`, `docs/hf-release-mirror-verifier-20260829.json`, `tests/test_hf_release_mirror_verifier.py`). This improves redundancy observability but does not establish preservation acceptance or stable-v1 gates.\n- [ ] 4.11 Reconcile the anonymously verified Hugging Face mirror and Zenodo DOI as complete preservation evidence for the `v0.4.0` public technical preview only; retain stable-candidate replication, provider restore, elapsed-operation and authority gates (`docs/v0.4.0-preservation-wp006-reconciliation-20260829.json`, `tests/test_v040_preservation_wp006_reconciliation.py`).\n- [ ] 4.12 Require lowercase 40-character hexadecimal Git revisions in campaign status source, observation and RC bindings, with malformed-input regression coverage; hosted execution, elapsed, preservation and authority gates remain open (`scripts/validate_campaign_status.py`, `tests/test_campaign_status.py`, `docs/campaign-status-revision-validation-20260830.json`).\n- [ ] 4.13 Correct the known truncated run-32519141017 revision from the immutable hosted run head and record the predecessor correction explicitly (`docs/campaign-status-correction-20260830.json`).\n- [ ] 4.14 Extend strict revision validation to supplemental observation and candidate fields with negative coverage; supplemental records retain their non-qualifying semantics (`scripts/validate_campaign_status.py`, `tests/test_campaign_status.py`, `docs/campaign-status-revision-validation-20260830.json`).\n- [ ] 4.15 Require every supplemental observation to carry a strict revision while keeping candidate revision optional-but-validated; record an immutable successor evidence artifact (`scripts/validate_campaign_status.py`, `tests/test_campaign_status.py`, `docs/campaign-status-supplemental-revision-validation-20260830.json`).\n- [ ] 4.16 Record fresh hosted supplemental beta and exact-candidate RC observations with receipt/log digests; retain their technical-preview classification and all elapsed, recovery, external, preservation and authority gates (`docs/hosted-beta-rc-campaign-observation-20260829-ddec941.json`, runs 33259405506/33259407593).\n- [ ] 4.17 Record the fresh hosted control-matrix supplemental drills with receipt/log digests; retain their technical-preview classification and all elapsed, production-recovery, national-scale, external, preservation and authority gates (`docs/hosted-control-matrix-observation-20260829-3b2fbf4.json`, runs 33259809069/33259810861/33259813004/33259815211/33259817003).\n- [ ] 4.18 Record the fresh hosted supplemental operational-observation drill with receipt/log digests; retain its technical-preview classification and do not advance beta/RC elapsed clocks or close recovery, national-scale, external, preservation or authority gates (`docs/hosted-supplemental-operational-observation-20260830-692545e.json`, run 33260680164).\n- [ ] 4.19 Record the fresh hosted supplemental recovery-rollback drill with receipt/log digests; retain its technical-preview classification and do not advance beta/RC elapsed clocks or close production-recovery, national-scale, external, preservation or authority gates (`docs/hosted-supplemental-recovery-observation-20260830-92b405c.json`, run 33261028041).\n- [ ] 4.20 Record the fresh hosted architecture-diverse supplemental performance rehearsal with both receipt/log digest pairs; the receipts are from one workflow run and are identified by `x86_64` and `arm64`; retain its technical-preview classification and do not advance beta/RC elapsed clocks or close national-scale, production-recovery, external, preservation or authority gates (`docs/hosted-supplemental-performance-observation-20260830-31e304a.json`, run 33261328505).\n- [ ] 4.21 Record the fresh hosted supplemental scale-smoke drill with receipt/log digests; retain its technical-preview classification and do not advance beta/RC elapsed clocks or close national-scale, production-recovery, external, preservation or authority gates (`docs/hosted-supplemental-scale-observation-20260830-9632c56.json`, run 33261927414).\n- [ ] R6 Validate operations report bundles by self-digest, exact component\n- [ ] R7 Require non-empty report identity and generation fields in the candidate bundle validator, with negative coverage (`scripts/build_operations_report_bundle.py`, `tests/test_operations_report_bundle.py`, `docs/operations-report-bundle-identity-validation-20260829.json`).\n- [ ] R5 Validate bounded coverage reports against their content digest, source-count shape and non-promotable national-coverage boundary (`src/riopa_provenance/archive_operations.py`, `tests/test_archive_operations.py`, `docs/operations-coverage-report-integrity-20260829.json`). Hosted national observations and release gates remain open.\n- [ ] R1 Constrain lifecycle transition endpoints to the declared job states and add a negative validation. Evidence: `schemas/operations-control.schema.json`, `tests/test_operations_control_contract.py`. (3af81f0)\n- [ ] R2 Record a bounded four-lens agent-panel qualification of operations, preservation and campaign controls without closing provider, elapsed, participant or authority gates (`docs/operations-panel-qualification-20260825.json`, `tests/test_operations_panel_qualification.py`).\n- [ ] R3 Reject malformed replication manifests, non-object receipts and duplicate target receipts before acceptance validation (`scripts/build_redundancy_manifest.py`, `tests/test_redundancy_manifest.py`).\n- [ ] R4 Bind the hosted recovery/rollback lane to the deterministic snapshot, restore and rollback harness rather than publication-only tests; retain production-representative recovery as an external gate (`scripts/record_hosted_evidence.py`, `tests/test_hosted_evidence.py`, `docs/operations-recovery-lane-contract-20260829.json`; 2026-08-29).\n- [ ] R8 Make beta/RC qualification activation explicit: supplemental drills remain retained without a cumulative elapsed ledger, while qualifying observations require an authority, activation timestamp and exact campaign binding (`.github/workflows/evidence-campaign.yml`, `scripts/record_hosted_evidence.py`, `schemas/hosted-evidence.schema.json`, `tests/test_hosted_evidence.py`, `docs/campaign-qualification-activation-20260829.json`; elapsed and promotion gates remain open).\n- [ ] C.1 Link implementation, test, review, migration and release evidence in `index.md` for the repository-owned slice; hosted, preservation and elapsed gates remain explicitly pending.\n- [ ] C.2 Regenerate methods, citation, roadmap status and issue configuration where affected.\n- [ ] C.3 Confirm no unresolved blocking gate, expired waiver or undocumented limitation remains.\n- [ ] C.4 Update metadata status and target-release evidence through the Conductor workflow; status remains `active`/M1 because the documented gates are unresolved.\n\n## Evidence\n\nLink code, tests, reports, decisions, migrations and immutable release artifacts in `conductor/tracks/operations_preservation_sre_20260719/index.md` before closing.",
