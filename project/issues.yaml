      "body": "Implementation phase for Conductor track `nz_spatial_source_registry_20260718`.\n\n## Tasks\n\n- [ ] 4.1 Complete records for every current authority.\n- [ ] 4.2 Conduct independent sample audit and correct findings.\n- [ ] 4.3 Build an immutable, unpublished registry and coverage release candidate. The deterministic candidate and coverage projection are content-addressed and promotion-disabled; publication, preservation, current-authority completeness and accountable release authority remain open (`src/riopa_provenance/registry.py::build_registry_release_candidate`, `docs/nz-source-registry-release-candidate-contract-20260825.json`, `tests/test_registry.py`).\n- [ ] C.1 Link implementation, test, agent-panel, migration and release-candidate evidence in `index.md` for the repository-owned bounded slice; authority, preservation and external-release gates remain open (`docs/nz-source-registry-closeout-evidence-20260826.json`, `tests/test_nz_source_registry_closeout_evidence.py`).\n- [ ] C.2 Regenerate methods, citation, roadmap status and issue configuration where affected. The locked methods generation, roadmap status, issue graph and full quality harness passed; the methods output was temporary and not a release artifact (`docs/source-registry-conductor-regeneration-20260825.json`).\n- [ ] C.3 Confirm no unresolved blocking gate, expired waiver or undocumented limitation remains.\n- [ ] C.4 Promote the bounded registry executable-proof boundary to experimental M2. The track remains `validating`; current-authority completeness, live rights/health evidence, repeated hosted monitoring, preservation, panel reproduction and accountable-owner gates remain assigned to M3-M6 (`docs/nz-source-registry-m2-promotion-20260829.json`, `tests/test_nz_source_registry_m2_promotion.py`).\n- [ ] C.5 Group missing and existing licence decisions into permissive public-archive tiers, separating copyright permission from authority, completeness and safety (`docs/source-rights-publication-decision-matrix-20260829.json`, `tests/test_source_rights_publication_decision_matrix.py`).\n- [ ] C.6 Adopt full lawful capture and private preservation as the default unless explicitly restricted, while retaining an affirmative-basis requirement only for public payload copying (`docs/source-rights-archive-default-20260829.json`, `tests/test_source_rights_archive_default.py`).\n- [ ] C.7 Capture and publicly preserve the three newly qualified Tier-A ArcGIS layers with exact payload, licence and fixity receipts. Evidence: `docs/tier-a-archive-capture-evidence-20260829.json`, `docs/public-tier-a-archive-publication-20260829.json`, public Hugging Face revision `001137c0df64e9f8a7b0539fd0286a7cd5819ce7`, and merged PR #636. Publication is bounded; authority, completeness, currentness and operational claims remain open.\n- [ ] R3 Apply the sole-developer subagent-panel policy while preserving factual source-rights, hosted-observation, preservation and owner-authority boundaries.\n- [ ] R4 Replace blanket permission holds with exact-item and publisher-wide open-licence decisions for the WCC Churton layer, NZ ambulance prototype and Greater Wellington GIS, while retaining provenance, authority and safety limitations (`docs/source-rights-publication-decision-matrix-20260829.json`, `tests/test_source_rights_publication_decision_matrix.py`).\n- [ ] R5 Confirm the maximal archive default distinguishes explicit retention restrictions from copyright's affirmative public-copying requirement and does not rely on takedown as permission (`docs/source-rights-archive-default-20260829.json`).\n- [ ] R1 Fail closed on unknown authentication types and malformed capability arrays in readiness projections. (`src/riopa_provenance/registry.py`, `tests/test_source_registry_readiness.py`; commit `f78743a`)\n- [ ] R2 Review the registry release candidate for deterministic ordering, duplicate-source rejection, digest binding and publication fail-closed semantics. (`src/riopa_provenance/registry.py::build_registry_release_candidate`, `tests/test_registry.py`, `docs/nz-source-registry-release-candidate-contract-20260825.json`)\n- [ ] R6 Reject empty and duplicate endpoint identifiers in registry release candidates (`src/riopa_provenance/registry.py`, `tests/test_registry.py`, `docs/source-registry-endpoint-integrity-20260829.json`).\n\n## Evidence\n\nLink code, tests, reports, decisions, migrations and immutable release artifacts in `conductor/tracks/nz_spatial_source_registry_20260718/index.md` before closing.",
