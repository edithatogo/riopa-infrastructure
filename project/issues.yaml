      "key": "program-epic",
      "title": "[Program] RIOPA provenance-first research infrastructure v1.0",
      "labels": [
        "type:program",
        "provenance",
        "geospatial"
      ],
      "body": "Build an open, modular, provenance-first research infrastructure ecosystem and its first New Zealand spatial reference implementation.\n\n## Outcomes\n\n- Shared provenance, transformation, quality, research-object and citation contracts.\n- A Conductor-aware repository/bootstrap template and staged adoption across existing repositories.\n- A temporally versioned NZ spatial archive linking council planning layers to source rules.\n- Reusable accessibility, facility-location and simulation engines.\n- Supermarket/health and emergency/hospital applied pilots.\n\n## Programme evidence\n\n- `conductor/product.md`\n- `conductor/design.md`\n- `conductor/tracks.md`\n- `docs/architecture.md`\n- `docs/standards-profile.md`\n\nThe parent and sub-issues generated from this repository are the executable roadmap.",
      "project": true,
      "mirror_to_umbrella": true
    },
