ection, preserve the exclusion\n- [ ] 5.3 Reconcile G.1 with the available panel packet: retain the partial\n- [ ] 5.4 Validate historical stable-gate snapshots by their self-contained\n- [ ] 5.5 Add a fail-closed contract validator for the missing facility panel\n- [ ] 5.6 Harden the panel manifest contract with exact four-lens cardinality,\n- [ ] G.1 Agent-panel qualification of the deterministic 741-row review frame is partially recorded in `docs/facility-panel-frame-qualification-20260825.json`; the required content-bound roles/session manifest and factual pair/sample adjudication remain open, and no promotion is enabled.\n- [ ] G.2 Record the Hamilton packet as explicitly attribute-only because all 3,245 archived assertions have null geometry (`docs/facility-panel-qualification-20260803.json`, `docs/facility-food-reconciliation-20260803.json`, `tests/test_public_dataset_archive_plan.py`). No geometry, completeness or authoritative facility claim is enabled.\n- [ ] G.3 A second public health source family with an immutable archive receipt. The bounded Rangitīkei public ambulance-facility assertions are registered from the preserved Zenodo successor packet with a verified payload digest (`config/archive-sources/rangitikei-public-ambulance-2023.json`, `docs/public-health-ambulance-source-qualification-20260825.json`, `tests/test_public_dataset_archive_plan.py`). Reconciliation, currentness, completeness, authoritative ambulance coverage and operational use remain disabled.\n- [ ] G.4 Stable public-only, non-authoritative registry projection with source-disagreement and coverage reports is implemented and tested (`FACILITY-DISAGREEMENT-COVERAGE-20260822`, `FACILITY-SNAPSHOT-CORRECTION-20260824`). Completeness, panel adjudication, publication and accountable release approval remain open.\n- [ ] G.5 Immutable release snapshot, correction process and accountable release-authority decision.\n- [ ] Harden `validate_snapshot_record` to validate the nested assertion array