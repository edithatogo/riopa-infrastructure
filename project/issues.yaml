ix references with the observed 2026-08-29 successor while preserving the 2026-08-25 predecessor snapshot (`docs/wp006-matrix-traceability-20260829.json`, `docs/conformance-and-release-verification.md`).\n- [ ] R15 Bind the matrix traceability receipt to the exact 40-character merged revision and guard it with a regression test (review fix; 2026-08-29).\n- [ ] R16 Require positive, negative and migration case classes in the normative corpus before parity execution, with negative coverage for unknown and missing classes (2026-08-29).\n- [ ] R17 Harden OpenLineage projection validation for non-empty run/job/dataset identity and producer/schema fields, with negative contract coverage (2026-08-29; `docs/wp006-openlineage-projection-validation-20260829.json`).\n- [ ] R19 Enforce lowercase 64-character SHA-256 subject digests before building unsigned DSSE/in-toto envelopes, with negative contract coverage (2026-08-29; `docs/wp006-dsse-subject-digest-validation-20260829.json`).\n- [ ] R20 Reject empty PROV graph identifiers in the bounded projection validator, with negative contract coverage (2026-08-29; `docs/wp006-prov-identity-validation-20260829.json`).\n- [ ] R18 Guard corpus case-class membership by type before set lookup so malformed non-string values fail with structured validation errors (review fix; 2026-08-29).\n- [ ] R20 Bind the technical-preview report's declared fixture digest to the checked-in client-workflow bytes and reject tampered fixture digests (2026-08-29; `docs/wp006-release-report-fixture-binding-20260829.json`).\n- [ ] R21 Return a controlled validation result when the release-report CLI receives a JSON scalar or array (review fix; 2026-08-29).\n- [ ] R22 Add a deterministic local validator for the v0.4.0 successor\n\n## Evidence\n\nLink code, tests, reports, decisions, migrations and immutable release artifacts in `conductor/tracks/interoperability_conformance_sdks_20260719/index.md` before closing.",
