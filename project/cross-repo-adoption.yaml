      "body": "Adopt the shared RIOPA provenance profile without replacing the existing tamper-evident payload hash chain.\n\n## Scope\n\n- Map current `ProvenanceRecord` fields into artifact/capture events.\n- Preserve current chain verification as integrity evidence.\n- Emit source, input/output, agent, rights and schema references alongside current outputs.\n- Add golden fixtures and round-trip validation against `riopa-infrastructure`.\n\n## Acceptance\n\n- Existing chain tests remain green.\n- One real/synthetic capture emits a valid RIOPA event stream.\n- The mapping identifies semantic loss and unsupported fields.\n- No source-specific network responsibility moves out of `fyi-cli`.\n\nProgramme track: `repository_template_adoption_20260718`."
